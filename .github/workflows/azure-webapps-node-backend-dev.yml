name: Backend Updates (dev branch)

on:
    push:
        branches:
            - dev
        paths:
            - "backend/**"
            - "shared/**"
    pull_request:
        branches:
            - dev
        paths:
            - "backend/**"
            - "shared/**"
    workflow_dispatch:

env:
    AZURE_WEBAPP_NAME: "itadakistreetseriesanalyzertemp"
    AZURE_WEBAPP_PACKAGE_PATH: "."
    NODE_VERSION: "24.x"
    BRANCH_NAME: "dev"
    DIRECTORY_NAME: "backend"

permissions:
    contents: read

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                node-version: ${{ env.NODE_VERSION }}
                cache: "npm"
                cache-dependency-path: ${{ env.DIRECTORY_NAME }}/package-lock.json

            - name: npm install, build, and test
              working-directory: ${{ env.DIRECTORY_NAME }}
              run: |
                npm install --ignore-scripts
                npm run build --if-present
                npm run test --if-present

            - name: Copy shared files
              run: |
                cp -r shared ${{ env.DIRECTORY_NAME }}/shared

            - name: Deploy to Azure Web App
              uses: azure/webapps-deploy@v3
              id: deploy-to-webapp
              if: github.actor != 'dependabot[bot]'
              with:
                app-name: ${{ env.AZURE_WEBAPP_NAME }}
                publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
                package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/${{ env.DIRECTORY_NAME }}
